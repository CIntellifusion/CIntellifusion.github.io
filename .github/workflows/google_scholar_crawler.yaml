name: Get Citation Data

on:
  workflow_dispatch:
  page_build:
  push:
    branches: [main]
    paths:
      - .github/workflows/google_scholar_crawler.yaml
      - google_scholar_crawler/**
      - _config.yml
  schedule:
    - cron: '17 8 * * *'

permissions:
  contents: write

concurrency:
  group: google-scholar-stats
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r google_scholar_crawler/requirements.txt
      - name: Check crawler
        run: python -m unittest discover -s google_scholar_crawler -p 'test_*.py'
      - name: Fetch citation data
        run: python google_scholar_crawler/main.py
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
      - name: Publish citation data
        shell: bash
        run: |
          set -euo pipefail
          publish_dir="$RUNNER_TEMP/google-scholar-stats"
          remote_branch=$(git ls-remote --heads origin refs/heads/google-scholar-stats)
          if [ -n "$remote_branch" ]; then
            git fetch --no-tags origin refs/heads/google-scholar-stats
            git worktree add --detach "$publish_dir" FETCH_HEAD
          else
            git worktree add --detach "$publish_dir" HEAD
            git -C "$publish_dir" checkout --orphan google-scholar-stats
            git -C "$publish_dir" rm -rf --quiet .
          fi
          cp google_scholar_crawler/results/gs_data.json "$publish_dir/"
          cp google_scholar_crawler/results/gs_data_shieldsio.json "$publish_dir/"
          git -C "$publish_dir" config user.name "github-actions[bot]"
          git -C "$publish_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$publish_dir" add gs_data.json gs_data_shieldsio.json
          if git -C "$publish_dir" diff --cached --quiet; then
            echo "Citation data is unchanged."
            exit 0
          fi
          git -C "$publish_dir" commit -m "Update citation data"
          git -C "$publish_dir" push origin HEAD:refs/heads/google-scholar-stats
