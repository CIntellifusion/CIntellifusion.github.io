{% assign gs_cdn_url = 'https://cdn.jsdelivr.net/gh/' | append: site.repository | append: '@google-scholar-stats/gs_data.json' %}
{% assign gs_raw_url = 'https://raw.githubusercontent.com/' | append: site.repository | append: '/google-scholar-stats/gs_data.json' %}
<script src="{{ '/assets/js/scholar-stats.js' | relative_url }}"
  {% if site.google_scholar_stats_use_cdn %}
  data-primary-url="{{ gs_cdn_url | escape }}"
  data-fallback-url="{{ gs_raw_url | escape }}"
  {% else %}
  data-primary-url="{{ gs_raw_url | escape }}"
  data-fallback-url="{{ gs_cdn_url | escape }}"
  {% endif %}
  defer></script>
